<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="方杰的个人主页：展示教育背景、实习经历、研究项目与技能结构的中英双语赛博朋克作品集。" />
    <meta name="author" content="方杰 Fang Jie" />
    <meta name="keywords" content="方杰,Fang Jie,个人主页,portfolio,resume,研究,项目,经济学,数学,数据分析" />
    <title>方杰｜个人主页</title>

    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet" />

    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script type="text/javascript" src="static/js/marked.min.js"></script>

    <script>
        MathJax = {
            tex: {
                packages: {},
                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ],
                processEscapes: false,
                processEnvironments: true,
                processRefs: true,
                digits: /^(?:[0-9]+(?:\{,\}[0-9]{3})*(?:\.[0-9]*)?|\.[0-9]+)/,
                tags: 'all',
                tagSide: 'right',
                tagIndent: '0.8em',
                useLabelIds: true,
                maxMacros: 10000,
                maxBuffer: 5 * 1024,
                formatError: (jax, err) => jax.formatError(err)
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script"
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script type="text/javascript" src="static/js/js-yaml.min.js"></script>
    <script type="text/javascript" src="static/js/scripts.js"></script>
</head>

<body id="page-top">
    <div class="page-ambient" aria-hidden="true"></div>
    <div class="page-grid" aria-hidden="true"></div>
    <div class="page-scanlines" aria-hidden="true"></div>

    <nav class="header navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container px-4 px-lg-5 nav-shell">
            <a id="page-top-title" class="navbar-brand brand-mark fw-bold" href="#page-top"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                MENU
                <i class="bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto me-0 me-lg-2 my-3 my-lg-0 nav-pills-shell">
                    <li class="nav-item"><a class="nav-link me-lg-2" href="#home" id="nav-home"></a></li>
                    <li class="nav-item"><a class="nav-link me-lg-2" href="#awards" id="nav-awards"></a></li>
                    <li class="nav-item"><a class="nav-link me-lg-2" href="#experience" id="nav-experience"></a></li>
                    <li class="nav-item"><a class="nav-link" href="#publications" id="nav-publications"></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="top-section hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-stars" aria-hidden="true"></div>
        <div class="hero-moon" aria-hidden="true"></div>
        <div class="hero-city city-back" aria-hidden="true"></div>
        <div class="hero-city city-mid" aria-hidden="true"></div>
        <div class="hero-city city-front" aria-hidden="true"></div>
        <div class="container px-4 px-lg-5 hero-shell">
            <div class="hero-copy hero-copy-minimal">
                <div class="hero-toolbar hero-toolbar-minimal">
                    <div class="lang-switch" aria-label="Bilingual language toggle">
                        <button type="button" class="lang-option lang-option-active" id="lang-zh" aria-pressed="true">中</button>
                        <span class="lang-divider"></span>
                        <button type="button" class="lang-option" id="lang-en" aria-pressed="false">EN</button>
                    </div>
                </div>
                <h1 id="top-section-bg-text" class="hero-title"></h1>
                <div class="hero-actions hero-actions-minimal">
                    <a class="hero-button hero-button-primary" href="#home"><span id="hero-button-primary-text"></span></a>
                    <a class="hero-button hero-button-secondary" href="#publications"><span id="hero-button-secondary-text"></span></a>
                </div>
            </div>
            <div class="hero-side hero-side-minimal">
                <div class="avatar-frame" id="avatar">
                    <div class="avatar-glow"></div>
                    <div class="avatar-noise"></div>
                    <img src="static/assets/img/photo.png" alt="Profile photo" />
                    <div class="avatar-badge avatar-badge-bottom" id="avatar-badge-bottom"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-stage">
        <section class="content-section" id="home">
            <div class="container px-4 px-lg-5">
                <div class="section-panel section-panel-primary">
                    <header class="panel-header">
                        <div>
                            <p class="panel-index" id="home-panel-index"></p>
                            <h2 id="home-subtitle"></h2>
                        </div>
                        <div class="panel-corner-tag" id="home-panel-tag"></div>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="home-md"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="content-section" id="awards">
            <div class="container px-4 px-lg-5">
                <div class="section-panel section-panel-magenta">
                    <header class="panel-header">
                        <div>
                            <p class="panel-index" id="awards-panel-index"></p>
                            <h2><i class="bi bi-award-fill"></i><span id="awards-subtitle"></span></h2>
                        </div>
                        <div class="panel-corner-tag" id="awards-panel-tag"></div>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="awards-md"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="content-section" id="experience">
            <div class="container px-4 px-lg-5">
                <div class="section-panel section-panel-cyan">
                    <header class="panel-header">
                        <div>
                            <p class="panel-index" id="experience-panel-index"></p>
                            <h2><i class="bi bi-briefcase-fill"></i><span id="experience-subtitle"></span></h2>
                        </div>
                        <div class="panel-corner-tag" id="experience-panel-tag"></div>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="experience-md"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="content-section" id="publications">
            <div class="container px-4 px-lg-5">
                <div class="section-panel section-panel-violet">
                    <header class="panel-header">
                        <div>
                            <p class="panel-index" id="publications-panel-index"></p>
                            <h2><i class="bi bi-file-text-fill"></i><span id="publications-subtitle"></span></h2>
                        </div>
                        <div class="panel-corner-tag" id="publications-panel-tag"></div>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="publications-md"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-bottom text-center py-5">
        <div class="container px-4 px-lg-5 footer-shell">
            <div class="footer-label" id="footer-label"></div>
            <div class="text-white-50 small footer-meta">
                <div id="copyright-text" class="mb-2"></div>
                <div class="footer-links">
                    <a id="github-link" href="https://github.com/jacob6812">GitHub</a>
                    <span class="mx-1">&middot;</span>
                    <a id="license-link" href="https://github.com/jacob6812/jacob6812.github.io/blob/main/LICENSE">License</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
